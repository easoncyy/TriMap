name: Verify Infra and Pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloudflare
      - run: npm run typecheck
      - run: npm test
      - run: npm test --prefix cloudflare
      - run: npm run build --prefix cloudflare
